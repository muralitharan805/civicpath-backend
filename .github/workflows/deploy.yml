name: Deploy to VPS via SSH

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy CivicPath Backend to VPS
    runs-on: ubuntu-latest
    steps:
      - name: Debug Network Connection
        run: |
          echo "🌐 Testing connectivity to VPS..."
          ping -c 4 ${{ secrets.SERVER_HOST }} || true
          echo "🔌 Testing SSH Port access..."
          nc -zv -w 5 ${{ secrets.SERVER_HOST }} ${{ secrets.SERVER_PORT || '22' }} || true

      - name: Execute SSH Deployment via Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            echo "📁 Navigating to project directory..."
            cd ${{ secrets.PROJECT_PATH }}

            echo "📥 Pulling latest git repository changes..."
            git pull origin main || git pull origin master

            echo "🐳 Starting containerized application suite..."
            docker compose -f docker-compose.yml -f docker-compose.existing-infra.yml up -d --build

            echo "🧹 Cleaning up dangling image layers to save disk space..."
            docker image prune -f

            echo "✅ Deployment completed successfully!"
