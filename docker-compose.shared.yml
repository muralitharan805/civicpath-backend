services:
  db:
    image: pgvector/pgvector:16-pgvector
    container_name: civicpath-db
    environment:
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_DATABASE}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: always

  redis:
    image: redis:7-alpine
    container_name: civicpath-redis
    command: redis-server --save 60 1 --loglevel notice
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  redisinsight:
    image: redis/redisinsight:latest
    container_name: civicpath-redisinsight
    ports:
      - "${REDISINSIGHT_PORT:-5540}:5540"
    restart: always

volumes:
  pgdata:
    name: civicpath_pgdata
  redisdata:
    name: civicpath_redisdata
