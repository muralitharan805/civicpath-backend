version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner # Uses the lightweight, dependency-pruned production stage
    command: sh -c "npx prisma migrate deploy && node dist/src/main"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=${DB_HOST:-pgvector-db}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE=${DB_DATABASE}
      - DATABASE_URL=postgresql://${DB_USERNAME}:${DB_PASSWORD}@${DB_HOST:-pgvector-db}:${DB_PORT:-5432}/${DB_DATABASE}?schema=public
      - REDIS_HOST=${REDIS_HOST:-redis-dev}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "${PORT:-3001}:3000"
    restart: always
    networks:
      - db_network
      - redis_network

networks:
  db_network:
    name: ${DB_NETWORK_NAME:-pgvector_network}
    external: true
  redis_network:
    name: ${REDIS_NETWORK_NAME:-redis_default}
    external: true
